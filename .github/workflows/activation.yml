name: Acquire Unity Activation File

on:
  workflow_dispatch:

jobs:
  activation:
    name: Acquire .alf file
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Request activation file
        uses: game-ci/unity-builder@v4
        with:
          entrypoint: /bin/bash
          customParameters: -quit -batchmode -nographics -logFile /dev/stdout -createManualActivationFile

      - name: Expose activation file
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: activation-file
          path: manualActivationFile.alf
