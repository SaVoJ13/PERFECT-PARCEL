name: Acquire Unity Activation File

on:
  workflow_dispatch:

jobs:
  activation:
    name: Generate ALF File
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:ubuntu-2022.3.20f1-base-3.0.0
    steps:
      - name: Request ALF
        run: |
          unity-editor -quit -batchmode -nographics -createManualActivationFile -logfile /dev/stdout || true
          ls -la
          cp *.alf manualActivationFile.alf || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnityActivationFile
          path: manualActivationFile.alf
