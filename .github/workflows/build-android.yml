name: Build Android APK (Game-CI)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/activation.yml'
      - 'README.md'
      - 'docs/**'

env:
  # Та сама версія, що в ProjectSettings/ProjectVersion.txt і docs/architecture/TECH_STACK.md
  UNITY_VERSION: 6000.3.28f1

jobs:
  buildAndroid:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-${{ env.UNITY_VERSION }}-

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: ${{ env.UNITY_VERSION }}
          buildMethod: KebabStreet.Editor.BuildScript.BuildAndroidApk
          versioning: None
          buildName: KebabStreet
          androidExportType: androidPackage
          androidKeystoreName: release.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          customParameters: -nographics -DisableDirectoryMonitor

      # ТИМЧАСОВО (E0-03, генерація файлів редактора) — прибрати до кінця завдання
      - name: TEMP git status
        if: always()
        run: git status --porcelain --untracked-files=all | grep -v '^?? Library/' | head -300 || true

      - name: TEMP editor info
        if: always()
        continue-on-error: true
        run: |
          IMG=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep unityci/editor | head -1)
          echo "image: $IMG"
          docker run --rm --entrypoint bash "$IMG" -c 'cat /opt/unity/Editor/Data/Resources/PackageManager/Editor/manifest.json | head -c 20000; echo; find /opt/unity/Editor/Data/PlaybackEngines/AndroidPlayer -maxdepth 3 -type d | head -80' || true

      - name: TEMP upload generated project files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KebabStreet-Generated-Project-Files
          path: |
            ProjectSettings
            Packages
            Assets/**/*.meta
            Assets/*.asset
            Assets/Resources
            Assets/_Project/Settings
          retention-days: 3

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KebabStreet-Android-Builds
          path: build/Android
          retention-days: 14
