name: Build Android APK (Game-CI)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/activation.yml'
      - 'README.md'
      - 'docs/**'

env:
  # Та сама версія, що в ProjectSettings/ProjectVersion.txt і docs/architecture/TECH_STACK.md
  UNITY_VERSION: 6000.3.28f1

jobs:
  buildAndroid:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-${{ env.UNITY_VERSION }}-

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: ${{ env.UNITY_VERSION }}
          buildMethod: KebabStreet.Editor.BuildScript.BuildAndroidApk
          versioning: None
          buildName: KebabStreet
          androidExportType: androidPackage
          androidKeystoreName: release.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          customParameters: -nographics -DisableDirectoryMonitor

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KebabStreet-Android-Builds
          path: build/Android
          retention-days: 14

      # Довідка в журналі: ідентифікатор, min/target API і архітектури з готового APK.
      - name: Print APK Info
        run: |
          IMAGE=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep '^unityci/editor' | head -1)
          docker run --rm -v "$PWD/build/Android:/apk:ro" --entrypoint bash "$IMAGE" -c '
            AAPT2=$(find /opt/unity/Editor/Data/PlaybackEngines/AndroidPlayer/SDK/build-tools -name aapt2 | sort | tail -1)
            "$AAPT2" dump badging /apk/KebabStreet.apk | grep -E "^(package|sdkVersion|minSdkVersion|targetSdkVersion|native-code)"'

      # Після чистого checkout редактор не має створювати чи змінювати файли проєкту:
      # усі .meta і налаштування мають бути закомічені (файли редактора генерує лише CI).
      - name: Verify Project Files Are Committed
        run: |
          CHANGES=$(git status --porcelain --untracked-files=all -- Assets/_Project Packages ProjectSettings)
          if [ -n "$CHANGES" ]; then
            echo "::error::Редактор Unity створив або змінив файли проєкту, яких немає в коміті"
            echo "$CHANGES"
            git diff --stat -- Assets/_Project Packages ProjectSettings
            git diff -- Assets/_Project Packages ProjectSettings | sed -E 's/(Android(Keystore|Keyalias)Name: ).+/<приховано>/' | head -200
            exit 1
          fi
          echo "Файли проєкту збігаються з комітом."
